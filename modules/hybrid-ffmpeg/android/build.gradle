// File: modules/hybrid-ffmpeg/android/build.gradle
plugins {
    id 'com.android.library'
    id 'expo-module-gradle-plugin'
}

group = 'expo.modules.hybridffmpeg'
version = '0.1.0'

android {
    namespace "expo.modules.hybridffmpeg"
    defaultConfig {
        versionCode 1
        versionName "0.1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':expo-modules-core')
    
    // FFmpegKit Maintained
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.7'
    
    // REQUIRED by FFmpegKit for JNI exception handling (Fixes the NoClassDefFoundError)
    implementation 'com.arthenica:smart-exception-java:0.2.1'
}